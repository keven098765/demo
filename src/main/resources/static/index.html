<h1>学生管理系统 API</h1>
<p>接口文档：<a href="/doc.html">/doc.html</a></p>
<ul>
    <li>GET /users - 查询所有学生</li>
    <li>GET /user/{id} - 按 id 查询</li>
    <li>GET /students?page=1&size=10 - 分页查询</li>
    <li>POST /add-student - 添加学生</li>
    <li>PUT /update-student - 更新学生</li>
    <li>DELETE /delete-student/{id} - 删除学生</li>
</ul>
</body>
</html>
